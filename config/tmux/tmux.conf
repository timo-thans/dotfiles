# Main workflow defaults.
set -g default-terminal "tmux-256color"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
set -g escape-time 10

# Terminal theme: graphite base with warm active accents.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#101820,fg=#8ea0ae"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[bg=#ffcc66,fg=#101820,bold] #S #[bg=#17232d,fg=#ffcc66] "
set -g status-right "#[bg=#56687a,fg=#101820] %H:%M #[bg=#8bd5ca,fg=#101820,bold] %d %b "
setw -g window-status-format "#[fg=#56687a,bg=#101820] #I:#W "
setw -g window-status-current-format "#[fg=#101820,bg=#7dd3fc,bold] #I:#W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#253747"
set -g pane-active-border-style "fg=#ffcc66"
set -g message-style "bg=#ffcc66,fg=#101820,bold"
set -g mode-style "bg=#8bd5ca,fg=#101820,bold"
set -g clock-mode-colour "#ffcc66"

# Use Ctrl-a as the tmux prefix.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Pane splits:
#   Prefix + v  -> vertical split, panes side by side
#   Prefix + h  -> horizontal split, panes stacked
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Keep the familiar split keys too.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane movement and resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
