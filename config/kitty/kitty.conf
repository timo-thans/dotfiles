# Kitty terminal configuration migrated from Alacritty.

# Launch the existing tmux workflow in every Kitty window.
shell /bin/sh -c 'exec "$HOME/.local/bin/kitty-tmux-launch"'

# Window and appearance.
start_as maximized
dynamic_title yes
background_opacity 0.94
foreground #d7e0ea
background #101820
cursor #ffcc66
cursor_text_color #101820
selection_foreground #101820
selection_background #8bd5ca
enable_audio_bell no
font_size 12.0

# Alacritty-compatible 16-color palette.
color0 #17232d
color1 #f08c7f
color2 #8bd5ca
color3 #ffcc66
color4 #7aa2f7
color5 #c792ea
color6 #7dd3fc
color7 #d7e0ea
color8 #56687a
color9 #ff9f91
color10 #9ee6dc
color11 #ffd980
color12 #8db3ff
color13 #d6a2ff
color14 #94e2ff
color15 #f5f7fa

# Alacritty keyboard workflow.
map ctrl+shift+enter new_os_window_with_cwd
map ctrl+space send_text all \x1b

# Keep copied text available through the system clipboard.
clipboard_control write-clipboard write-primary read-clipboard read-primary
